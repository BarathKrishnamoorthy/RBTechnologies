name: Build Hello Bro Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: Grant Executable Permissions to Gradle Wrapper
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/hellobro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellobro-apk
          path: build-output/hellobro.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Hello Bro Android APK v1.0.0
          body: |
            ## 🚗 Hello Bro - Mobile App for Android
            Download and install the official Hello Bro Android app on your phone.
            
            - **File**: `hellobro.apk`
            - **Platform**: Android 8.0+
            - **Package**: `com.hellobro.app`
          files: build-output/hellobro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
