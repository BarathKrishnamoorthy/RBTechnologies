name: Build Hello Bro Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: Generate Standalone Offline JS Bundle & Assets
        working-directory: ./mobile
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed --entry-file index.js --platform android --dev false --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Patch Android Gradle Config for Release Signing
        working-directory: ./mobile/android
        run: |
          python3 -c "
          import re
          path = 'app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Ensure release signingConfig uses debug keystore
          if 'signingConfig signingConfigs.debug' not in content[content.find('release {'):content.find('packagingOptions')]:
              content = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.debug', content, count=1)

          content = re.sub(r'minifyEnabled\s+.*', 'minifyEnabled false', content)
          content = re.sub(r'shrinkResources\s+.*', 'shrinkResources false', content)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Successfully patched app/build.gradle')
          "

      - name: Build Standalone APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Package APK
        run: |
          mkdir -p build-output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Packaging release APK..."
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/hellobro.apk
          elif [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Packaging debug APK with offline bundle..."
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/hellobro.apk
          else
            echo "ERROR: No APK found!"
            find mobile/android/app/build/outputs/apk/ -name "*.apk"
            exit 1
          fi

          echo "APK size and info:"
          ls -lh build-output/hellobro.apk

          echo "Verifying embedded index.android.bundle inside APK:"
          unzip -l build-output/hellobro.apk | grep "index.android.bundle"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellobro-standalone-apk
          path: build-output/hellobro.apk

      - name: Create or Update GitHub Release with Standalone APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Hello Bro Android Standalone APK v1.0.0
          body: |
            ## 🚗 Hello Bro Standalone Android APK (v1.0.0)
            Official standalone Android app with pre-packaged JavaScript bundle and assets.
            
            - **100% Standalone Offline Bundle** — No Metro or computer needed.
            - **File**: `hellobro.apk`
            - **Platform**: Android 8.0+
            - **Worldwide Direct Download**: Free high-speed global CDN
          files: build-output/hellobro.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
