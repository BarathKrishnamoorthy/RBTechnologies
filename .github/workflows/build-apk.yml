name: Build Hello Bro Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Prebuild Native Android Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: Configure Standalone Offline JS Bundle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          # Ensure release uses debug signing key and bundles all JS/assets
          sed -i '/react {/a \    bundleInRelease = true\n    bundleInDebug = true' app/build.gradle

      - name: Build Standalone Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy & Rename Release APK
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/hellobro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellobro-standalone-apk
          path: build-output/hellobro.apk

      - name: Create or Update GitHub Release with Standalone APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Hello Bro Android Standalone APK v1.0.0
          body: |
            ## 🚗 Hello Bro Standalone Android APK
            Official standalone Android app with pre-packaged JavaScript bundle and assets.
            
            - **No Metro or PC needed** — works 100% standalone offline!
            - **File**: `hellobro.apk`
            - **Platform**: Android 8.0+
            - **Package**: `com.hellobro.app`
          files: build-output/hellobro.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
